name: Publish Docker Image

# A release publishes its own tag. To retry a release whose publish failed, run
# this workflow manually from main and give it the tag: the pipeline comes from
# main (so a fix to it applies) while the code and version come from the tag.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. v0.15.0. Leave empty to build this branch as a dev image.'
        required: false
        type: string
      latest:
        description: 'Also point "latest" at this release. Untick when republishing an older version.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A release runs on its tag, and a manual run can name one. A manual run
      # without a tag builds its branch, which has no version of its own.
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
              echo "Not a release tag: '$INPUT_TAG' (expected something like v0.15.0)" >&2
              exit 1
            fi
            echo "VERSION=${INPUT_TAG#v}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "REVISION=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Inject version into code
        run: |
          echo "export const VERSION = '${{ steps.version.outputs.VERSION }}';" > src/version.ts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: davidfuchs/mcp-uptime-kuma
          # The version tags come from the tag input when there is one, and from
          # the release's own tag otherwise. "latest" follows them automatically
          # unless a manual run opts out. A dev build of the default branch has
          # no version tags and is published as "latest" only.
          flavor: |
            latest=${{ (inputs.tag != '' && inputs.latest == false) && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref_name == github.event.repository.default_branch }}
          # The commit that was built, which on a retry is the tag's and not main's.
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.REVISION }}

      - name: Build and push to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Docker Hub page is updated by update-dockerhub-description.yml, not here.
          